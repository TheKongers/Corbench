apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cortex-ingress
  namespace: corbench-{{ .PR_NUMBER }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /api/v1/push
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /{{ .PR_NUMBER }}/cortex-pr/api/v1/write
        pathType: ImplementationSpecific
        backend:
          service:
            name: cortex-test-pr-{{ .PR_NUMBER }}
            port:
              number: 9009
      - path: /{{ .PR_NUMBER }}/cortex-pr
        pathType: Prefix
        backend:
          service:
            name: cortex-test-pr-{{ .PR_NUMBER }}
            port:
              number: 9009
      - path: /{{ .PR_NUMBER }}/cortex-release/api/v1/write
        pathType: ImplementationSpecific
        backend:
          service:
            name: cortex-test-{{ normalise .RELEASE }}
            port:
              number: 9009
      - path: /{{ .PR_NUMBER }}/cortex-release
        pathType: Prefix
        backend:
          service:
            name: cortex-test-{{ normalise .RELEASE }}
            port:
              number: 9009
