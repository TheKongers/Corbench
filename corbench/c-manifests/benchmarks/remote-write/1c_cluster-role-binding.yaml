kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: loadgen-scaler
  namespace: corbench-{{ .PR_NUMBER }}
rules:
- apiGroups: ["apps"]
  resources:
  - deployments
  verbs: ["get", "list", "update"]
---
# Need to give get/update access to loadgen-scaler
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loadgen-scaler
  namespace: corbench-{{ .PR_NUMBER }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loadgen-scaler
subjects:
- kind: ServiceAccount
  name: loadgen-scaler
  namespace: corbench-{{ .PR_NUMBER }}
---
# Need to give Cortex access to pull metrics if needed
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  #PR number is used in name to avoid conflict with multiple corbench instances
  name: cortex-{{ .PR_NUMBER }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus  # Reusing the prometheus ClusterRole we created earlier
subjects:
- kind: ServiceAccount
  name: cortex
  namespace: corbench-{{ .PR_NUMBER }}