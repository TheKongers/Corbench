# yamllint disable-file
# This file is not valid YAML because of the range template.
cluster:
  name: {{ .CLUSTER_NAME }}
nodegroups:
  - nodegroupname: cortex-{{ .PR_NUMBER }}
    noderole: {{ .EKS_WORKER_ROLE_ARN }}
    disksize: 100
    subnets:
      {{ range $subnetId := split .EKS_SUBNET_IDS .SEPARATOR }}
      - {{ $subnetId }}
      {{ end }}
    instancetypes:
      - r5d.2xlarge 
    scalingconfig:
      desiredsize: 2
      maxsize: 2
      minsize: 2
    labels:
      isolation: cortex
      node-name: cortex-{{ .PR_NUMBER }}
  - nodegroupname: nodes-{{ .PR_NUMBER }}
    noderole: {{ .EKS_WORKER_ROLE_ARN }}
    disksize: 100
    subnets:
      {{ range $subnetId := split .EKS_SUBNET_IDS .SEPARATOR }}
      - {{ $subnetId }}
      {{ end }}
    instancetypes:
      - c5.4xlarge
    scalingconfig:
      desiredsize: 1
      maxsize: 1
      minsize: 1
    labels:
      isolation: none
      node-name: nodes-{{ .PR_NUMBER }}