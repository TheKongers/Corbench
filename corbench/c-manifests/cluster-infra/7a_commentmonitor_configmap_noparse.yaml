apiVersion: v1
kind: ConfigMap
metadata:
  name: comment-monitor-config
data:
  config.yml: |
    prefixes:
    - prefix: /corbench
      help: |
        **Available Commands:**
        * To start benchmark: `/corbench <branch or git tag to compare with>`
        * To restart benchmark: `/corbench <branch or git tag to compare with>`
        * To stop benchmark: `/corbench cancel`
        * To print help: `/corbench help`

        **Advanced Flags for `start` and `restart` Commands:**
        * `--bench.directory=<sub-directory of your corbench repo>`
          * Defaults to `c-manifests/corbench`.
        * `--bench.version=<branch | @commit>`
          * Defaults to `master`.

        **Examples:**
        * `/corbench v1.15.0`
        * `/corbench v1.15.0 --bench.version=@abc123 --bench.directory=c-manifests/corbench`

      verify_user: true
      commands:
      - name: cancel
        event_type: corbench_stop
        comment_template: |
          Cortex benchmark cancel is in progress.

      - name: restart
        event_type: corbench_restart
        arg_regex: (master|main|v[0-9]+\.[0-9]+\.[0-9]+\S*)
        arg_name: RELEASE
        flag_args:
          bench.directory: BENCHMARK_DIRECTORY
          bench.version: BENCHMARK_VERSION
        comment_template: |
          ⏱️ Welcome (again) to Cortex Benchmarking Tool. ⏱️

          **Compared versions:** [**`PR-{{ index . "PR_NUMBER" }}`**](http://{{ index . "DOMAIN_NAME" }}/{{ index . "PR_NUMBER" }}/cortex-pr) and [**`{{ index . "RELEASE" }}`**](http://{{ index . "DOMAIN_NAME" }}/{{ index . "PR_NUMBER" }}/cortex-release)

          {{- $version := index . "BENCHMARK_VERSION" }}
          {{- $directory := index . "BENCHMARK_DIRECTORY" | print "c-manifests/corbench" }}
          {{- with $version }}

          **Custom benchmark version:**
          {{- if hasPrefix $version "@" }} [**`{{ trimPrefix $version "@" }}` commit**](https://github.com/cortexproject/cortex/tree/{{ trimPrefix $version "@" }}/{{ or $directory "c-manifests/corbench" }})
          {{- else }} [**`{{ $version }}` branch**](https://github.com/cortexproject/cortex/tree/{{ $version }}/{{ or $directory "c-manifests/corbench" }}){{ end }}
          {{- end }}

          After successful deployment, the benchmarking results can be viewed at:

          - [Prometheus Meta](http://{{ index . "DOMAIN_NAME" }}/prometheus-meta/graph?g0.expr={namespace%3D"corbench-{{ index . "PR_NUMBER" }}"}&g0.tab=1)
          - [Corbench Dashboard](http://{{ index . "DOMAIN_NAME" }}/grafana/d/corbench/corbench?orgId=1&var-pr-number={{ index . "PR_NUMBER" }})

          **Available Commands:**
          * To restart benchmark: `/corbench restart {{ index . "RELEASE" }}{{ if index . "BENCHMARK_VERSION" }} --bench.version={{ index . "BENCHMARK_VERSION" }}{{ end }}{{ if index . "BENCHMARK_DIRECTORY" }} --bench.directory={{ index . "BENCHMARK_DIRECTORY" }}{{ end }}`
          * To stop benchmark: `/corbench cancel`
          * To print help: `/corbench help`

      - name: "" # start is a default (empty command).
        event_type: corbench_start
        arg_regex: (master|main|v[0-9]+\.[0-9]+\.[0-9]+\S*)
        arg_name: RELEASE
        flag_args:
          bench.directory: BENCHMARK_DIRECTORY
          bench.version: BENCHMARK_VERSION
        label: corbench
        comment_template: |
          ⏱️ Welcome to Cortex Benchmarking Tool. ⏱️

          **Compared versions:** [**`PR-{{ index . "PR_NUMBER" }}`**](http://{{ index . "DOMAIN_NAME" }}/{{ index . "PR_NUMBER" }}/cortex-pr) and [**`{{ index . "RELEASE" }}`**](http://{{ index . "DOMAIN_NAME" }}/{{ index . "PR_NUMBER" }}/cortex-release)

          {{- $version := index . "BENCHMARK_VERSION" }}
          {{- $directory := index . "BENCHMARK_DIRECTORY" }}
          {{- with $version }}

          **Custom benchmark version:**
          {{- if hasPrefix $version "@" }} [**`{{ trimPrefix $version "@" }}` commit**](https://github.com/cortexproject/cortex/tree/{{ trimPrefix $version "@" }}/{{ or $directory "c-manifests/corbench" }})
          {{- else }} [**`{{ $version }}` branch**](https://github.com/cortexproject/cortex/tree/{{ $version }}/{{ or $directory "c-manifests/corbench" }}){{ end }}
          {{- end }}

          After the successful deployment, the benchmarking results can be viewed at:

          - [Prometheus Meta](http://{{ index . "DOMAIN_NAME" }}/prometheus-meta/graph?g0.expr={namespace%3D"corbench-{{ index . "PR_NUMBER" }}"}&g0.tab=1)
          - [Corbench Dashboard](http://{{ index . "DOMAIN_NAME" }}/grafana/d/corbench/corbench?orgId=1&var-pr-number={{ index . "PR_NUMBER" }})

          **Available Commands:**
          * To restart benchmark: `/corbench restart {{ index . "RELEASE" }}{{ if index . "BENCHMARK_VERSION" }} --bench.version={{ index . "BENCHMARK_VERSION" }}{{ end }}{{ if index . "BENCHMARK_DIRECTORY" }} --bench.directory={{ index . "BENCHMARK_DIRECTORY" }}{{ end }}`
          * To stop benchmark: `/corbench cancel`
          * To print help: `/corbench help`