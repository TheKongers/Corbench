apiVersion: v1
kind: ConfigMap
metadata:
  name: comment-monitor-config
data:
  config.yml: |
    prefixes:
    - prefix: /corbench
      help: |
        **Available Commands:**
        * To start benchmark: `/corbench <cortex-tag>`
        * To stop benchmark: `/corbench cancel`
        * To print help: `/corbench help`

        **Cortex tag format:** `master-<commit-hash>` (e.g., `master-6b3bd7b`) This will be the version of cortex that your PR will be benchmarked against
        * MAKE SURE TO PICK AN EXISTING CORTEX TAG FROM BELOW LINK, OR DEPLOYMENT WILL BE STUCK AND YOU WILL HAVE TO CANCEL AND START AGAIN
        * Check what cortex tags are avaliable to choose from at https://hub.docker.com/r/cortexproject/cortex/tags

        **Examples:**
        * `/corbench master-6b3bd7b`
        * `/corbench master-9861229`

      verify_user: true
      commands:
      - name: cancel
        event_type: corbench_stop
        comment_template: |
          Cortex benchmark cancel is in progress. See status here: https://github.com/cortexproject/cortex/actions/workflows/corbench.yml

      - name: "" # start is a default (empty command).
        event_type: corbench_start
        arg_regex: master-[a-f0-9]{7,}
        arg_name: CORTEX_TAG
        label: corbench
        comment_template: |
          ⏱️ Welcome to Cortex Benchmarking Tool. ⏱️

          **Compared versions:** [**`PR-{{ index . "PR_NUMBER" }}`**] and [**`{{ index . "CORTEX_TAG" }}`**]

          After the successful deployment ([check status here](https://github.com/cortexproject/cortex/actions/workflows/corbench.yml)), the benchmarking results can be viewed at:

          - [Infra Cluster Dashboard](http://a6f1abccb155d422da0ca0b906de709b-1932259410.us-west-2.elb.amazonaws.com/grafana/d/cetkogsl2ed4we/node-metrics?orgId=1)
          - [Corbench Dashboard](http://a6f1abccb155d422da0ca0b906de709b-1932259410.us-west-2.elb.amazonaws.com/grafana/d/eetkogsyiuo74c/corbench-metrics?orgId=1&var-prNumber={{ index . "PR_NUMBER" }})

          If deployment fails, make sure to clean up using /corbench cancel and double check your cortex tag exists: https://hub.docker.com/r/cortexproject/cortex/tags

          **Available Commands:**
          * To stop benchmark: `/corbench cancel`
          * To print help: `/corbench help`